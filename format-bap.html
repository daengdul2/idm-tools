<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator BAP - Multi Form Per Kategori</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-container">
    <div class="app-nav">
        <a href="index.html" class="back-link">← Menu</a>
        <span class="app-name">Generator BAP</span>
    </div>

    <div class="import-box">
        <label><b>Isi / Impor Data dari Teks Laporan Existing:</b></label>
        <textarea id="importText" placeholder="Tempel/Paste teks laporan di sini...&#10;Contoh:&#10;01_saybread_10_5_2✅&#10;01_IFC_12_4_1"></textarea>
        <button class="btn-import" onclick="imporTeksLaporan()">📥 Masukkan Data ke Laporan</button>
    </div>

    <h2>Input Data Per Kategori</h2>
    
    <div class="multi-form-container">
        <!-- SAYBREAD -->
        <div class="kat-row">
            <div class="kat-label">SAYBREAD (<span id="no-SAYBREAD">1</span>)</div>
            <div class="input-group"><label>BPB</label><input type="number" id="bpb-SAYBREAD" placeholder="0"></div>
            <div class="input-group"><label>Sales</label><input type="number" id="sales-SAYBREAD" placeholder="0"></div>
            <div class="input-group"><label>BAP</label><input type="number" id="bap-SAYBREAD" placeholder="0"></div>
            <div class="input-group"><label>Status</label>
                <select id="stat-SAYBREAD">
                    <option value="">Normal</option>
                    <option value="✅">Centang (✅)</option>
                    <option value=" (blm bpb minyak SK)">blm bpb minyak SK</option>
                    <option value=" (belum BPB minyak SK)">belum BPB minyak SK</option>
                </select>
            </div>
        </div>

        <!-- IFC -->
        <div class="kat-row">
            <div class="kat-label">IFC (<span id="no-IFC">1</span>)</div>
            <div class="input-group"><label>BPB</label><input type="number" id="bpb-IFC" placeholder="0"></div>
            <div class="input-group"><label>Sales</label><input type="number" id="sales-IFC" placeholder="0"></div>
            <div class="input-group"><label>BAP</label><input type="number" id="bap-IFC" placeholder="0"></div>
            <div class="input-group"><label>Status</label>
                <select id="stat-IFC">
                    <option value="">Normal</option>
                    <option value="✅">Centang (✅)</option>
                    <option value=" (blm bpb minyak SK)">blm bpb minyak SK</option>
                    <option value=" (belum BPB minyak SK)">belum BPB minyak SK</option>
                </select>
            </div>
        </div>

        <!-- BAKPAO&DIMSUM -->
        <div class="kat-row">
            <div class="kat-label">BAKPAO&DIMSUM (<span id="no-BAKPAO&DIMSUM">1</span>)</div>
            <div class="input-group"><label>BPB</label><input type="number" id="bpb-BAKPAO&DIMSUM" placeholder="0"></div>
            <div class="input-group"><label>Sales</label><input type="number" id="sales-BAKPAO&DIMSUM" placeholder="0"></div>
            <div class="input-group"><label>BAP</label><input type="number" id="bap-BAKPAO&DIMSUM" placeholder="0"></div>
            <div class="input-group"><label>Status</label>
                <select id="stat-BAKPAO&DIMSUM">
                    <option value="">Normal</option>
                    <option value="✅">Centang (✅)</option>
                    <option value=" (blm bpb minyak SK)">blm bpb minyak SK</option>
                    <option value=" (belum BPB minyak SK)">belum BPB minyak SK</option>
                </select>
            </div>
        </div>

        <!-- SOSIS -->
        <div class="kat-row">
            <div class="kat-label">SOSIS (<span id="no-SOSIS">1</span>)</div>
            <div class="input-group"><label>BPB</label><input type="number" id="bpb-SOSIS" placeholder="0"></div>
            <div class="input-group"><label>Sales</label><input type="number" id="sales-SOSIS" placeholder="0"></div>
            <div class="input-group"><label>BAP</label><input type="number" id="bap-SOSIS" placeholder="0"></div>
            <div class="input-group"><label>Status</label>
                <select id="stat-SOSIS">
                    <option value="">Normal</option>
                    <option value="✅">Centang (✅)</option>
                    <option value=" (blm bpb minyak SK)">blm bpb minyak SK</option>
                    <option value=" (belum BPB minyak SK)">belum BPB minyak SK</option>
                </select>
            </div>
        </div>
    </div>
    
    <button class="btn-submit-all" onclick="prosesSemuaKategori()">+ Tambah Semua Data Terisi ke Laporan</button>

    <div class="workspace">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Kat</th>
                        <th>No</th>
                        <th>BPB</th>
                        <th>Sales</th>
                        <th>BAP</th>
                        <th>Stat</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        
        <div>
            <textarea id="outputText" class="output-area output-dark" readonly></textarea>
            <button class="btn btn-copy" onclick="salinTeks()">Salin Teks Laporan</button>
        </div>
    </div>

    <button class="btn btn-reset" onclick="resetSemuaData()" style="margin-top: 16px;">⚠ Hapus Semua Data & Mulai Ulang Laporan</button>
</div>

<script src="common.js"></script>
<script src="format-bap.js"></script>
</body>
</html>
